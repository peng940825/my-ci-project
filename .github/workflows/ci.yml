name: CI Check

# 什麼時候觸發這個機器人？
on:
  push:
    branches: [main] # 當有人 push 到 main 分支時
  pull_request:
    branches: [main] # 當有人對 main 發 PR 時

jobs:
  test-and-build:
    runs-on: ubuntu-latest # 使用最新的 Linux 虛擬機

    steps:
      # 第一步：把你的程式碼複製到虛擬機上
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 【關鍵】抓取完整 Git 歷史，否則 commitlint 抓不到 PR 的提交紀錄

      # 第二步：安裝 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # 幫你把套件快取起來，下次跑會變快

      # 第三步：安裝套件 (使用 npm ci 比 install 更嚴格、更乾淨)
      - name: Install dependencies
        run: npm ci

      # 第四步：檢查 commit 格式
      - name: Lint Commit Messages
        run: |
          # 確保我們有足夠的歷史紀錄
          git fetch origin ${{ github.base_ref || github.ref_name }} --depth=100

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR 環境：檢查從目標分支 (base) 到目前的差異
            npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
          else
            # Push 環境：只檢查最後一個 commit (如果不是首個 commit)
            npx commitlint --from HEAD~1 --to HEAD --verbose || npx commitlint --from HEAD --verbose
          fi

      - name: AI Code Review (Custom Script)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 取得代碼變動
          DIFF=$(git diff origin/main...HEAD)

          # 2. 建立腳本：換成 v1 穩定版網址與模型名稱
          cat << 'EOF' > review.cjs
          const fs = require('fs');

          async function main() {
            const diff = process.env.DIFF_CONTENT;
            const apiKey = process.env.GEMINI_API_KEY;

            if (!diff || diff.length < 10) {
              fs.writeFileSync('review.txt', '✅ 偵測到變動極小，AI 判斷無需細節審核。');
              return;
            }

            // 【關鍵修正】改用 v1 正式版 API 與最新的模型名稱標籤
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ 
                    parts: [{ 
                      text: `你是一位資深前端專家。請針對以下 React 與 TypeScript 代碼變動給出具體的優化建議（特別是效能與型別）：\n\n${diff}` 
                    }] 
                  }]
                })
              });

              const resData = await response.json();
              
              if (resData.error) {
                // 如果 API 還有問題，我們直接印出 JSON 方便 Debug
                fs.writeFileSync('review.txt', `❌ API 報錯: ${resData.error.message}\n(Code: ${resData.error.code})`);
                return;
              }

              const aiText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
              if (aiText) {
                fs.writeFileSync('review.txt', `### 🤖 AI Code Review 報告\n\n${aiText}`);
              } else {
                fs.writeFileSync('review.txt', `⚠️ AI 回傳格式異常: ${JSON.stringify(resData).substring(0, 100)}...`);
              }
            } catch (err) {
              fs.writeFileSync('review.txt', `❌ 腳本執行錯誤: ${err.message}`);
            }
          }

          main();
          EOF

          # 3. 執行腳本
          export DIFF_CONTENT="$DIFF"
          node review.cjs

          # 4. 確保檔案寫入後再留言
          sleep 3
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt

      # 第五步：打包前先跑測試
      - name: Run Tests
        run: npx vitest run

      # 第六步：跑完測試後順便檢查 TypeScript 型別
      - name: Type Check
        run: npx tsc --noEmit

      # 第七步：執行 Lint 檢查（就是你在本地跑的那套）
      - name: Run Lint
        run: npm run lint

      # 第八步：嘗試打包專案 (確保編譯不會噴錯)
      - name: Build Project
        run: npm run build
