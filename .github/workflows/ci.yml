name: CI Check

# 什麼時候觸發這個機器人？
on:
  push:
    branches: [main] # 當有人 push 到 main 分支時
  pull_request:
    branches: [main] # 當有人對 main 發 PR 時

jobs:
  test-and-build:
    runs-on: ubuntu-latest # 使用最新的 Linux 虛擬機

    steps:
      # 第一步：把你的程式碼複製到虛擬機上
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 【關鍵】抓取完整 Git 歷史，否則 commitlint 抓不到 PR 的提交紀錄

      # 第二步：安裝 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # 幫你把套件快取起來，下次跑會變快

      # 第三步：安裝套件 (使用 npm ci 比 install 更嚴格、更乾淨)
      - name: Install dependencies
        run: npm ci

      # 第四步：檢查 commit 格式
      - name: Lint Commit Messages
        run: |
          # 確保我們有足夠的歷史紀錄
          git fetch origin ${{ github.base_ref || github.ref_name }} --depth=100

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR 環境：檢查從目標分支 (base) 到目前的差異
            npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
          else
            # Push 環境：只檢查最後一個 commit (如果不是首個 commit)
            npx commitlint --from HEAD~1 --to HEAD --verbose || npx commitlint --from HEAD --verbose
          fi

      - name: AI Code Review (Custom Script)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 取得代碼變動 (Diff)
          DIFF=$(git diff origin/main...HEAD)

          # 2. 建立 Node 腳本執行審核
          cat << 'EOF' > review.js
          const { execSync } = require('child_process');
          const https = require('https');

          const diff = process.env.DIFF_CONTENT;
          const apiKey = process.env.GEMINI_API_KEY;

          const data = JSON.stringify({
            contents: [{
              parts: [{
                text: `請作為資深前端工程師，針對以下 React 效能與 TS 規範進行 Review，並用繁體中文給出建議：\n\n${diff}`
              }]
            }]
          });

          const options = {
            hostname: 'generativelanguage.googleapis.com',
            path: `/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          };

          const req = https.request(options, (res) => {
            let body = '';
            res.on('data', (d) => body += d);
            res.on('end', () => {
              const response = JSON.parse(body);
              const text = response.candidates[0].content.parts[0].text;
              console.log(text);
              require('fs').writeFileSync('review.txt', text);
            });
          });

          req.on('error', (e) => { console.error(e); process.exit(1); });
          req.write(data);
          req.end();
          EOF

          # 3. 執行腳本並留言
          export DIFF_CONTENT="$DIFF"
          node review.js

          # 等待一下確保檔案寫入完成
          sleep 5

          # 4. 使用 GitHub 內建 CLI 留言
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt

      # 第五步：打包前先跑測試
      - name: Run Tests
        run: npx vitest run

      # 第六步：跑完測試後順便檢查 TypeScript 型別
      - name: Type Check
        run: npx tsc --noEmit

      # 第七步：執行 Lint 檢查（就是你在本地跑的那套）
      - name: Run Lint
        run: npm run lint

      # 第八步：嘗試打包專案 (確保編譯不會噴錯)
      - name: Build Project
        run: npm run build
